name: Package installer
on:
  push:
    tags: ['v4.*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: npm ci && npm run build && npm run test:wallet
      - run: python -m pytest -q tests
      - run: python scripts/package.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Trading_News_Agent_v4.zip dist/SHA256SUMS.txt --title "Trading News Agent $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
